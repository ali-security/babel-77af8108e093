name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional Jest test path pattern"
        required: false
        default: ""

permissions:
  contents: read

env:
  # The lockfile pins caniuse-lite 1.0.30001615 (May 2024); browserslist prints an
  # "outdated caniuse-lite" warning to stderr, which breaks log-asserting tests.
  BROWSERSLIST_IGNORE_OLD_DATA: "1"
  # Prints every Jest test reported as skipped or pending, with the upstream gate in
  # its test file that skipped it (Jest itself only prints a bare skip count).
  # ES5 on purpose: it also runs on the Node 6/8/10 legs.
  SEAL_JEST_SKIP_REPORT: |
    var fs = require("fs"), path = require("path"), file = process.argv[1];
    if (!fs.existsSync(file)) { console.log("No Jest JSON results at " + file); process.exit(0); }
    var r = JSON.parse(fs.readFileSync(file, "utf8")), cache = {}, n = 0;
    var gate = /\b(?:it|test|describe)\.(?:skip|todo)\b|\b(?:it|describe)(?:Babel7\w*|Babel8\w*|Gte|Lt|Satisfies|NoWin32|ESM|NoESM|Negate|Dummy)\b|\bnodeGte\d+\b|\bprocess\.platform\b|\bsemver\.\w+\(|\bBABEL_8_BREAKING\b|\bUSE_ESM\b|\bIS_PUBLISH\b/g;
    function why(f) {
      if (cache[f]) return cache[f];
      var src = "", seen = {}, list = [], m;
      try { src = fs.readFileSync(f, "utf8"); } catch (e) {}
      while ((m = gate.exec(src))) if (!seen[m[0]]) { seen[m[0]] = 1; list.push(m[0]); }
      gate.lastIndex = 0;
      if (/test-runner|runFixtureTests/.test(src)) list.push("fixture runner: fixture disabled upstream (dot-prefixed fixture dir, or skipWindows/SKIP_* in its options.json)");
      return (cache[f] = list.length ? list.join(", ") : "skip declared in upstream test source");
    }
    // CLI process tests (batch-test-runner) are named "<suite> <test>" after their
    // test/fixtures/<suite>/<test>/options.json, whose gates decide the skip.
    function fixtureGate(s, a) {
      var fn = a.fullName.replace(/^\S+ \[\d+\/\d+\] /, ""), i = s.name.lastIndexOf(path.sep + "test" + path.sep), sp = fn.indexOf(" ");
      if (i < 0 || sp < 0) return "";
      var opt = path.join(s.name.slice(0, i), "test", "fixtures", fn.slice(0, sp), fn.slice(sp + 1), "options.json"), o, g = [];
      try { o = JSON.parse(fs.readFileSync(opt, "utf8")); } catch (e) { return ""; }
      ["minNodeVersion", "skipWindows", "BABEL_8_BREAKING", "os"].forEach(function (k) { if (k in o) g.push(k + "=" + JSON.stringify(o[k])); });
      return g.length ? path.relative(process.cwd(), opt) + " sets " + g.join(", ") + " (not satisfied by this Node version / platform / BABEL_8_BREAKING mode)" : "";
    }
    console.log("Environment: Node " + process.version + " on " + process.platform + ", BABEL_8_BREAKING=" + (process.env.BABEL_8_BREAKING || "unset") + ", USE_ESM=" + (process.env.USE_ESM || "unset"));
    r.testResults.forEach(function (s) {
      (s.assertionResults || []).forEach(function (a) {
        if (a.status !== "pending" && a.status !== "skipped" && a.status !== "todo") return;
        n++;
        var fx = fixtureGate(s, a);
        console.log("SKIPPED [" + a.status + "] " + path.relative(process.cwd(), s.name) + " > " + a.fullName + "  -- reason: " + (fx ? "fixture gate: " + fx : "upstream conditional skip, gates in this test file: " + why(s.name)));
      });
    });
    console.log("Skipped-test report: " + n + " skipped/todo; totals: " + r.numPassedTests + " passed, " + r.numFailedTests + " failed, " + r.numPendingTests + " pending, " + (r.numTodoTests || 0) + " todo, " + r.numTotalTests + " total");

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-yarn-cache:
    name: Prepare Cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: 'Check or update Yarn cache (fix w/ "yarn install")'
        env:
          YARN_ENABLE_HARDENED_MODE: true # enable hardened mode as CI may run on untrusted repos
          YARN_ENABLE_SCRIPTS: false # disable post-install scripts
          YARN_NODE_LINKER: pnp # use pnp linker for better linking performance: it's meant to update yarn cache only
        run: |
          yarn install --mode=skip-build

  yarn-validate:
    name: Validate Yarn dependencies and constraints
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: 'Check for unmet constraints (fix w/ "yarn constraints --fix")'
        run: |
          yarn constraints
      - name: 'Check for duplicate dependencies (fix w/ "yarn dedupe")'
        run: |
          yarn dedupe --check
      - name: Check for dependency cycles
        # todo: investigate why we need to install dependencies here to not get
        # the following error:
        # Internal Error: chalk@condition:BABEL_8_BREAKING ?[...]: This package
        # doesn't seem to be present in your lockfile; run "yarn install" to
        # update the lockfile
        run: |
          yarn
          yarn release-tool check-cycles

  test-coverage:
    name: Test on Node.js Latest
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Generate coverage report
        # Same commands as `make -j test-ci-coverage`, plus Jest JSON results.
        run: |
          BABEL_ENV=test make -j bootstrap
          BABEL_ENV=test BABEL_COVERAGE=true yarn c8 jest --maxWorkers=100% --ci --json --outputFile="${{ runner.temp }}/jest-results.json" ${{ inputs.test-filter }}
          rm -rf coverage/tmp
          yarn test:esm
        env:
          BABEL_CLI_FLAKY_TESTS: true
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"

  test-esm:
    name: Test ESM version
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Use ESM and build
        run: make use-esm
        env:
          USE_ESM: true
      - name: Test
        run: yarn jest --ci --json --outputFile="${{ runner.temp }}/jest-results.json" ${{ inputs.test-filter }}
        env:
          BABEL_ENV: test
          USE_ESM: true
          BABEL_CLI_FLAKY_TESTS: trues
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"

  build:
    name: Build Babel Artifacts
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Yarn PnP does not support native ESM yet (https://github.com/yarnpkg/berry/issues/638)
    # env:
    #    YARN_NODE_LINKER: pnp # use pnp linker for better linking performance and stricter checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Build babel artifacts
        run: |
          make -j build-standalone-ci
        env:
          BABEL_ENV: test-legacy
          BABEL_8_BREAKING: false
          STRIP_BABEL_8_FLAG: true
      - name: Build Makefile.js
        run: |
          node ./scripts/pack-script.js
      - name: Generate readmes
        run: |
          make generate-readme
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          # packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js is a tracked build
          # output of @babel/runtime-corejs3 (not part of @babel/runtime); it is
          # regenerated from the patched wrapRegExp helper, so exclude only that file.
          git update-index --skip-worktree packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js
          node ./scripts/assert-dir-git-clean.js build
      - name: Prepare artifacts
        run: |
          ./scripts/get-artifact-files.sh | tar --null -cvf babel-artifact.tar --files-from=-
      - uses: actions/upload-artifact@v4
        with:
          name: babel-artifact
          path: babel-artifact.tar
          retention-days: 5

  build-windows:
    name: Build Babel Artifacts on Windows
    runs-on: windows-latest
    timeout-minutes: 50
    # Yarn PnP does not support native ESM yet (https://github.com/yarnpkg/berry/issues/638)
    # env:
    #    YARN_NODE_LINKER: pnp # use pnp linker for better linking performance and stricter checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Build babel artifacts
        shell: bash
        run: |
          make -j build-standalone-ci
        env:
          BABEL_ENV: test-legacy
          BABEL_8_BREAKING: false
          STRIP_BABEL_8_FLAG: true
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          # packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js is a tracked build
          # output of @babel/runtime-corejs3 (not part of @babel/runtime); it is
          # regenerated from the patched wrapRegExp helper, so exclude only that file.
          git update-index --skip-worktree packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js
          node ./scripts/assert-dir-git-clean.js build

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Lint
        run: make -j lint-ci check-compat-data
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          # packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js is a tracked build
          # output of @babel/runtime-corejs3 (not part of @babel/runtime); it is
          # regenerated from the patched wrapRegExp helper, so exclude only that file.
          git update-index --skip-worktree packages/babel-runtime-corejs3/helpers/esm/wrapRegExp.js
          node ./scripts/assert-dir-git-clean.js "lint-ci check-compat-data"

  test:
    name: Test on Node.js # GitHub will add ${{ matrix.node-version }} to this title
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 18, 16, 14, 12, 10, 8, 6]
    # The node 6/8/10 legs rewrite the root `@babel/*` deps and re-resolve them
    # (plus jest@24), so they must resolve against the release-era registry
    # instead of today's npm. The modern legs keep the default registry.
    env:
      YARN_NPM_REGISTRY_SERVER: ${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && 'https://time-machines-npm.sealsecurity.io/' || 'https://registry.yarnpkg.com' }}
      YARN_NPM_AUTH_TOKEN: ${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && '2024-06-05T13:14:57.058000Z' || '' }}
      YARN_NPM_ALWAYS_AUTH: ${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && 'true' || 'false' }}
      YARN_CHECKSUM_BEHAVIOR: ${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && 'update' || 'throw' }}
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest # Run yarn on latest node
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Install
        run: |
          yarn install
      - name: Downgrade Jest and Babel for node <= 10
        if: matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10'
        env:
          BABEL_DEP_VERSION: "^7.0.0"
        run: |
          # It's a bit sarcastic that in this scenario bump-babel-dependencies.js
          # actually downgrades the root `@babel/*` deps from 8.0 alpha to 7
          node ./scripts/integration-tests/utils/bump-babel-dependencies.js
          yarn up jest@24
          cd packages/babel-helper-transform-fixture-test-runner && yarn up jest-diff@24 && cd ../..
          # Deduplicate dependencies, because duplicate copies of graceful-fs cause
          # problems with the "path" module: https://github.com/facebook/jest/issues/9656
          yarn dedupe
      - name: Downgrade Jest and jest-light-runner for node == 12
        if: matrix.node-version == '12'
        run: |
          yarn up jest@28
          cd packages/babel-helper-transform-fixture-test-runner && yarn up jest-diff@28 && cd ../..
          yarn up jest-light-runner@0.3.0
          # Deduplicate dependencies, because duplicate copies of graceful-fs cause
          # problems with the "path" module: https://github.com/facebook/jest/issues/9656
          yarn dedupe
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Use Node.js ${{ matrix.node-version }} # Checkout node version for test executor
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test on node.js ${{ matrix.node-version }}
        # Todo(Babel 8): Jest execution path is hardcoded because Yarn 2 does not support node 6
        run: |
          BABEL_ENV=test node --max-old-space-size=4096 ./node_modules/.bin/jest --ci --json --outputFile="${{ runner.temp }}/jest-results.json" ${{ inputs.test-filter }}
        env:
          BABEL_CLI_FLAKY_TESTS: true
          TEST_FUZZ: "${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && 'false' || 'true' }}"
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"
      - name: Use Node.js latest # For `yarn version` in post actions of the first actions/setup-node
        if: matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10'
        uses: actions/setup-node@v4
        with:
          node-version: 22.1

  build-babel8:
    name: Build Babel 8 Artifacts
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Yarn PnP does not support native ESM yet (https://github.com/yarnpkg/berry/issues/638)
    # env:
    #    YARN_NODE_LINKER: pnp # use pnp linker for better linking performance and stricter checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Use ESM
        run: node scripts/set-module-type.js module
      - name: Build babel artifacts
        run: |
          make -j build-standalone-ci
        env:
          BABEL_ENV: test-legacy
          BABEL_8_BREAKING: true
          STRIP_BABEL_8_FLAG: true
      - name: Lint
        run: make -j lint-ci check-compat-data
        env:
          BABEL_ENV: test
          BABEL_8_BREAKING: true
          BABEL_TYPES_8_BREAKING: true
      - name: Prepare artifacts
        run: |
          ./scripts/get-artifact-files.sh | tar --null -cvf babel8-artifact.tar --files-from=-
      # Distinct basename from the Babel 7 babel-artifact.tar: the downstream
      # collector keys uploaded files by basename and rejects duplicates.
      - uses: actions/upload-artifact@v4
        with:
          name: babel8-artifact
          path: babel8-artifact.tar
          retention-days: 5

  test-babel-8-breaking:
    name: Test Babel 8 breaking changes on
    needs: build-babel8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 18.20.0
        uses: actions/setup-node@v4
        with:
          node-version: "18.20.0" # Node.js 18.20.0 is the first LTS supported by Babel 8
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel8-artifact
      - name: Extract artifacts
        run: tar -xf babel8-artifact.tar; rm babel8-artifact.tar
      - name: Use ESM
        run: node scripts/set-module-type.js module
      - name: Test
        run: yarn jest --ci --json --outputFile="${{ runner.temp }}/jest-results.json" ${{ inputs.test-filter }}
        env:
          BABEL_ENV: test
          BABEL_8_BREAKING: true
          BABEL_TYPES_8_BREAKING: true
          BABEL_CLI_FLAKY_TESTS: true
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"
      - name: Test ESM
        run: yarn test:esm
        env:
          BABEL_ENV: test
          BABEL_8_BREAKING: true
          BABEL_TYPES_8_BREAKING: true
          BABEL_CLI_FLAKY_TESTS: true

  test-windows-mac:
    name: Test on
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Test
        run: yarn jest --ci --json --outputFile="${{ runner.temp }}/jest-results.json" ${{ inputs.test-filter }}
        env:
          BABEL_ENV: test
          BABEL_CLI_FLAKY_TESTS: true
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"

  external-parser-tests:
    name: Third-party Parser Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Download tests
        run: make -j bootstrap-flow bootstrap-typescript bootstrap-test262
      - name: Run Test262 Tests
        run: make test-test262
      - name: Run Flow Tests
        run: make test-flow
      - name: Run TypeScript Tests
        run: make test-typescript

  runtime-interop:
    name: Test @babel/runtime integrations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      # See https://github.com/babel/babel/pull/12906
      - name: Support self-references on old Node.js
        run: |
          echo '{
            "type": "commonjs",
            "private": true,
            "devDependencies": {
              "@babel/runtime": "workspace:^",
              "@babel/runtime-corejs3": "workspace:^"
            }
          }' > packages/package.json
          node -e "
            const pkg = require('./package.json');
            pkg.workspaces.push('packages');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          "
      - name: Install
        run: yarn install
        env:
          # The "Support self-references on old Node.js" step mutates the
          # package.json file, causing a yarn.lock update.
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Generate absoluteRuntime tests
        run: yarn test:runtime:generate-absolute-runtime
      - name: Test bundlers
        run: yarn test:runtime:bundlers
      - name: Test Node.js latest
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 10
        uses: actions/setup-node@v4
        with:
          node-version: 10
      - name: Test Node.js 10
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 12.0
        uses: actions/setup-node@v4
        with:
          node-version: "12.0" # quoted, otherwise it's just 13
      - name: Test Node.js 12.0
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 12.17
        uses: actions/setup-node@v4
        with:
          node-version: 12.17
      - name: Test Node.js  12.17
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 13.0
        uses: actions/setup-node@v4
        with:
          node-version: "13.0" # quoted, otherwise it's just 13
      - name: Test Node.js 13.0
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 13.2
        uses: actions/setup-node@v4
        with:
          node-version: 13.2
      - name: Test Node.js 13.2
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 13.6
        uses: actions/setup-node@v4
        with:
          node-version: 13.6
      - name: Test Node.js 13.6
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 13.7
        uses: actions/setup-node@v4
        with:
          node-version: 13.7
      - name: Test Node.js 13.7
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 14.2
        uses: actions/setup-node@v4
        with:
          node-version: 14.2
      - name: Test Node.js 14.2
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 16.5
        uses: actions/setup-node@v4
        with:
          node-version: 16.5
      - name: Test Node.js 16.5
        run: node test/runtime-integration/node.cjs
      - name: Use Node.js 16.6
        uses: actions/setup-node@v4
        with:
          node-version: 16.6
      - name: Test Node.js 16.6
        run: node test/runtime-integration/node.cjs

  eslint7-test:
    name: Test @babel/eslint-* with ESLint 7.5.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 22.1
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Extract artifacts
        run: tar -xf babel-artifact.tar; rm babel-artifact.tar
      - name: Downgrade ESLint to 7.5.0
        run: yarn up eslint@7.5.0
      - name: Run babel/eslint tests
        run: node ./node_modules/.bin/jest eslint --json --outputFile="${{ runner.temp }}/jest-results.json"
      - name: List skipped tests with reasons
        if: always()
        shell: bash
        run: node -e "$SEAL_JEST_SKIP_REPORT" "${{ runner.temp }}/jest-results.json"

  eslint8-test:
    name: Test @babel/eslint-* with ESLint 8.0.0
    needs: build
    runs-on: ubuntu-latest
